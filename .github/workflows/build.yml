name: Build Applications

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build-windows:

    runs-on: windows-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install scipy pyinstaller

      - run: pyinstaller --onefile --windowed eta2p_calculator.py

      - name: Rename executable
        run: move dist\eta2p_calculator.exe dist\eta2p_calculator-windows.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/eta2p_calculator-windows.exe

  build-macos:
    
    needs: build-windows

    runs-on: macos-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install scipy pyinstaller

      - name: Build macOS application
        run: |
          pyinstaller --windowed eta2p_calculator.py

      - name: Create ZIP archive
        run: |
          cd dist
          zip -r eta2p_calculator-macos.zip eta2p_calculator.app

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/eta2p_calculator-macos.zip