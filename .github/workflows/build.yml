name: Build Applications

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build-windows:

    runs-on: windows-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install scipy pyinstaller

      - run: pyinstaller --onefile --windowed eta2p_calculator.py

      - name: Rename executable
        run: move dist\eta2p_calculator.exe dist\eta2p_calculator-windows.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/eta2p_calculator-windows.exe

  build-macos:

    runs-on: macos-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install scipy pyinstaller

      - run: pyinstaller --onefile --windowed eta2p_calculator.py

      - name: Rename executable
        run: mv dist/eta2p_calculator dist/eta2p_calculator-macos

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/eta2p_calculator-macos